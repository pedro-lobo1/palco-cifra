<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palco Cifra">
<title>Palco Cifra – Cifras sem anúncios</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0f1115; --panel:#161a21; --panel2:#1d222b; --line:#262c36;
  --text:#e9edf2; --muted:#8b95a5; --chord:#ffb547; --sec:#7fd8ff; --secbg:#173444;
  --accent:#2f6bff; --danger:#ff5c5c;
  --mono: ui-monospace, "Roboto Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button:disabled{opacity:.35}
input,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}

/* ---------- Cabeçalho / listas ---------- */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font-size:20px}
.icon{background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-width:44px;height:44px;font-size:18px}
.icon.sm{min-width:38px;height:38px;font-size:15px}
.icon.danger{color:var(--danger)}
.tabs{display:flex;gap:8px;padding:10px 12px}
.tabs button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.tabs button.on{background:var(--accent);border-color:var(--accent);font-weight:700}
.search{padding:0 12px 8px}
.list{padding:0 12px 110px}
.row{display:flex;align-items:center;gap:8px;padding:12px;margin-bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.row.sel{border-color:var(--accent);background:#14213f}
.grow{flex:1;min-width:0}
.grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key{color:var(--chord);font-weight:700;font-family:var(--mono);min-width:34px;text-align:center}
.num{color:var(--muted);width:22px;text-align:right;font-family:var(--mono)}
.chk{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:900}
.row.sel .chk{border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;line-height:1.5}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);font-size:32px;box-shadow:0 6px 20px #0008}
.bottom-bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.btn{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.wide{display:block;width:100%;margin-top:8px}
.btn.ghost{background:transparent}
.form{padding:12px 12px 110px;display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.form label small{font-size:12px}
.form .two{display:flex;gap:10px}
.form .two label{flex:1}
.form textarea{min-height:55vh;font-family:var(--mono);font-size:14px;line-height:1.4;white-space:pre;overflow-wrap:normal;overflow-x:auto;resize:vertical}
.paste{align-self:flex-start;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}

/* ---------- Modo Palco ---------- */
.stage{display:flex;flex-direction:column;height:100vh;height:100dvh}
.st-top{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.st-title{flex:1;min-width:0;cursor:pointer}
.st-title b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-title small{color:var(--muted)}
.st-key{display:flex;flex-direction:column;align-items:center;min-width:58px;padding:4px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.st-key span{font-size:10px;color:var(--muted);text-transform:uppercase}
.st-key b{font-family:var(--mono);color:var(--chord);font-size:20px;line-height:1.1}
.st-key small{font-size:10px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding:8px 12px;border-radius:999px;border:1px solid #24576f;background:var(--secbg);color:var(--sec);font-weight:700;font-size:13px}
.sheet{flex:1;overflow:auto;position:relative;padding:12px 14px 30px;font-family:var(--mono);font-size:var(--fs);line-height:1.35;-webkit-overflow-scrolling:touch}
.ln{white-space:pre;min-height:1.35em}
.ln.blank{min-height:.6em}
.ln.chord,.ic{color:var(--chord);font-weight:700}
.ln.tab{color:#9fb3c8;font-size:.8em}
.mode-chords .ln.chord{font-size:1.1em;margin:.15em 0}
.mode-lyrics .ln.lyr{white-space:pre-wrap;font-family:system-ui,sans-serif}
.sec{display:table;margin:.9em 0 .3em;padding:.15em .6em;border-radius:6px;background:var(--secbg);color:var(--sec);font-family:system-ui,sans-serif;font-weight:800;font-size:.75em;text-transform:uppercase;letter-spacing:.05em}
.notes{font-family:system-ui,sans-serif;font-size:.75em;background:#2a2412;border:1px solid #5a4a1c;color:#ffd98a;border-radius:8px;padding:8px 10px;margin-bottom:10px;white-space:pre-wrap}
.end{font-family:system-ui,sans-serif;font-size:.7em;color:var(--muted);text-align:center;margin-top:2em;padding:1em;border-top:1px dashed var(--line)}
.ctl{display:flex;gap:6px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line)}
.ctl button{flex:1;min-width:0;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:15px;padding:0}
.ctl button.on{background:var(--accent);border-color:var(--accent)}
.ctl .tr{color:var(--chord);font-family:var(--mono)}
.nav{display:flex;gap:8px;padding:0 8px calc(8px + env(safe-area-inset-bottom));background:var(--panel)}
.nav button{height:62px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:22px}
.nav button:first-child{width:76px}
.nav .nx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 14px;background:var(--accent);border-color:var(--accent);text-align:left}
.nav .nx small{font-size:11px;opacity:.85;text-transform:uppercase}
.nav .nx b{font-size:17px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Painéis / aviso ---------- */
.ov{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:flex-end}
.sheet-box{width:100%;max-height:85vh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-box h3{margin:0 0 10px}
.seg{display:flex;gap:6px;margin:6px 0 14px}
.seg button{flex:1;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.seg button.on{background:var(--accent);border-color:var(--accent);font-weight:700}
.hint{color:var(--muted);font-size:13px;line-height:1.5}
.jrow{display:flex;align-items:center;gap:10px;width:100%;padding:12px;margin-bottom:6px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);text-align:left}
.jrow.cur{border-color:var(--accent);background:#14213f}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-10px);z-index:99;background:#000d;color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
